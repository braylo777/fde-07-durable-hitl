[package]
name = "fde-07-durable-hitl"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Event-sourced agent workflows with approval gates, crash recovery, idempotent side effects and an accountability trail."
repository = "https://github.com/braylo777/fde-07-durable-hitl"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "fde-07-durable-hitl"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
hmac = "=0.12.1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
